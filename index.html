<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dev Explorer | Pro UI</title>
    <meta name="description" content="Interactive UI reference tool.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="app" id="app">
        <aside class="sidebar" id="sidebar">
            <header class="sb-head">
                <div class="brand">
                    <h2>Web Dev Explorer</h2>
                </div>
                <p>Interactive Reference UI</p>
            </header>
            <div class="sb-search">
                <input type="text" id="search" placeholder="Search..." aria-label="Search">
            </div>
            <nav class="sb-nav" id="sb-nav"></nav>
        </aside>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <main class="main">
            <header class="topbar">
                <button id="menu-btn" class="menu-btn" aria-label="Menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <h1 class="topbar-t" id="topbar-t">Welcome</h1>
            </header>
            <section class="content" id="content">
                <div class="welcome">
                    <h2>Select an element from the sidebar to begin</h2>
                    <p>Explore native tags, CSS properties, and advanced UI techniques with our live side-by-side
                        editing environment.</p>
                </div>
            </section>
        </main>
    </div>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
